<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deep</title>
<style>
  :root{--bg:#07080b;--line:rgba(255,255,255,.13);--paper:#e7e9ed;--muted:#9ba1aa;--dim:#69717c;--red:#b62e3b;--red-bright:#ff4d5e;--pale:#B8CDEB;--mono:Consolas,"Liberation Mono",monospace;--display:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(900px 520px at 50% -10%,#12141d 0%,var(--bg) 60%);color:var(--paper);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;min-height:100vh}
  ::selection{background:var(--red);color:#fff}
  main{max-width:640px;margin:0 auto;padding:10vh 22px 70px}
  .file-name{font:700 10px var(--mono);letter-spacing:.26em;color:var(--dim);margin:0 0 26px}
  .box{border:1px solid var(--line);background:linear-gradient(180deg,#0d0f16,#090a0f);padding:40px 30px;clip-path:polygon(0 0,94% 0,100% 5%,100% 100%,6% 100%,0 95%)}
  .gate-form{display:flex;gap:10px;flex-wrap:wrap}
  .gate-form input{background:#0b0c10;border:1px solid rgba(255,255,255,.24);color:var(--paper);font:600 15px var(--mono);letter-spacing:.14em;padding:13px 14px;outline:none;flex:1;min-width:180px}
  .gate-form input:focus{border-color:var(--red-bright)}
  .gate-form button{background:var(--red);color:#fff;border:0;font:700 11px var(--mono);letter-spacing:.18em;padding:0 24px;cursor:pointer;min-height:46px}
  .gate-form button:hover{background:var(--red-bright)}
  .gate-msg{font:12px var(--mono);letter-spacing:.2em;color:var(--muted);min-height:16px;margin:16px 0 0}
  .denied{animation:shake .32s ease}
  @keyframes shake{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
  .finale{text-align:center;padding-top:2vh}
  .finale p{opacity:0;animation:lineIn 1.2s ease forwards;font-size:15.5px;line-height:1.7;color:#dfe6f2;margin:0 0 20px}
  .finale p:nth-child(1){animation-delay:.4s}
  .finale p:nth-child(2){animation-delay:1.8s}
  .finale p:nth-child(3){animation-delay:3.2s}
  .finale p:nth-child(4){animation-delay:4.6s}
  .finale p:nth-child(5){animation-delay:6s}
  @keyframes lineIn{from{opacity:0;transform:translateY(8px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:38px 0;opacity:0;animation:lineIn 1.4s ease 7.2s forwards}
  .photos img{width:100%;height:100%;object-fit:cover;border:1px solid var(--line);filter:saturate(.85) brightness(.94);display:block}
  .key-line{font:800 clamp(24px,5vw,38px) var(--display);letter-spacing:.14em;color:var(--pale);text-shadow:0 0 24px rgba(184,205,235,.35);margin:10px 0 8px;opacity:0;animation:lineIn 1.4s ease 8.8s forwards}
  .word-line{font-size:17px;color:#fff;letter-spacing:.2em;margin:0 0 30px;opacity:0;animation:lineIn 1.2s ease 10s forwards}
  .fin{font:700 11px var(--mono);letter-spacing:.34em;color:var(--paper);margin:0 0 22px;opacity:0;animation:lineIn 1s ease 11.2s forwards}
  .credit{font:9.5px var(--mono);letter-spacing:.22em;line-height:2;color:var(--dim);margin:0 0 30px;opacity:0;animation:lineIn 1s ease 11.9s forwards}
  .finale-actions{opacity:0;animation:lineIn 1s ease 12.6s forwards}
  .back-link{display:inline-block;color:var(--muted);font:600 10.5px var(--mono);letter-spacing:.2em;text-decoration:none;border:1px solid var(--line);padding:12px 18px}
  .back-link:hover{color:var(--paper)}
</style>
</head>
<body>
<main>
  <p class="file-name">THE DEEPEST — 最奥</p>

  <section id="gateStage">
    <div class="box" id="gateBox">
      <div class="gate-form">
        <input id="gateInput" type="text" autocomplete="off" spellcheck="false">
        <button id="gateButton" type="button">開く</button>
      </div>
      <p class="gate-msg" id="gateMsg"></p>
    </div>
    <a class="back-link" href="room2.html" style="margin-top:30px">小部屋に戻る</a>
  </section>

  <section id="contentStage" hidden>
    <div class="finale">
      <p>「ずっと、探していた。」</p>
      <p>「あなたは、ここにいたのね。」</p>
      <p>「……アルマ？」</p>
      <p>「今度こそ、伝えるよ。好き。ずっと、好きだった。」</p>
      <p>「私も、好きだよ。ずっと、ずっと。……あえたね。」</p>
      <div class="photos">
        <img src="images/alma_portrait.jpg" alt="">
        <img src="images/noel_tv2.jpg" alt="">
      </div>
      <p class="key-line">SHE IS STILL HERE.</p>
      <p class="word-line">あえたね</p>
      <p class="fin">— FRAGMENT —</p>
      <p class="credit">FRAGMENT — 残像の欠片<br>CREATED BY ぱんだ</p>
      <div class="finale-actions">
        <a class="back-link" href="./">入口に戻る</a>
      </div>
    </div>
  </section>
</main>
<script>
"use strict";
var KEY = "fragment4-deep";
function openContent() {
  document.getElementById("gateStage").hidden = true;
  document.getElementById("contentStage").hidden = false;
}
function tryGate() {
  var v = document.getElementById("gateInput").value.trim().replace(/[\s　]+/g, "");
  if (v === "しろいはな" || v === "シロイハナ") {
    localStorage.setItem(KEY, "1");
    openContent();
  } else {
    document.getElementById("gateMsg").textContent = "……";
    var box = document.getElementById("gateBox");
    box.classList.remove("denied"); void box.offsetWidth; box.classList.add("denied");
  }
}
document.getElementById("gateButton").addEventListener("click", tryGate);
document.getElementById("gateInput").addEventListener("keydown", function (e) { if (e.key === "Enter") tryGate(); });
if (localStorage.getItem(KEY) === "1") openContent();
</script>
</body>
</html>
